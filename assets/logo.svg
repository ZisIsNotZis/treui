<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="title desc">
  <title id="title">treui</title>
  <desc id="desc">Three chat bubbles connected as a branching graph.</desc>

  <!-- edges: one message branching into two replies -->
  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M38 60 C 47 60, 47 18, 56 18" />
    <path d="M38 66 C 46 66, 46 74, 56 74" />
  </g>

  <!-- root message -->
  <g>
    <path d="M15 74 L15 83 L25 74 Z" fill="#a7f3d0" />
    <rect x="8" y="52" width="30" height="22" rx="10" fill="#a7f3d0" stroke="#047857" stroke-width="2" />
    <g fill="#047857">
      <circle cx="17" cy="63" r="1.8" />
      <circle cx="23" cy="63" r="1.8" />
      <circle cx="29" cy="63" r="1.8" />
    </g>
  </g>

  <!-- reply -->
  <g>
    <rect x="56" y="7" width="32" height="22" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
    <g fill="#1d4ed8">
      <circle cx="66" cy="18" r="1.8" />
      <circle cx="72" cy="18" r="1.8" />
      <circle cx="78" cy="18" r="1.8" />
    </g>
  </g>

  <!-- branch reply -->
  <g>
    <rect x="56" y="63" width="32" height="22" rx="10" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" />
    <g fill="#1d4ed8">
      <circle cx="66" cy="74" r="1.8" />
      <circle cx="72" cy="74" r="1.8" />
      <circle cx="78" cy="74" r="1.8" />
    </g>
  </g>
</svg>
